<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VLA HUD" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>VLA HUD</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">VLA OPERATING SYSTEM</p>
        <h1 id="dateLabel">Today</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Open settings">⚙</button>
    </header>

    <main>
      <section class="hero card">
        <div class="hero-grid">
          <div>
            <p class="label">CURRENT MODE</p>
            <h2 id="modeLabel">Growth Day</h2>
          </div>
          <div>
            <p class="label">ENERGY</p>
            <select id="energySelect" aria-label="Energy level">
              <option>High</option>
              <option selected>Standard</option>
              <option>Low</option>
            </select>
          </div>
        </div>
        <div class="mission-wrap">
          <p class="label">PRIMARY MISSION</p>
          <input id="missionInput" type="text" placeholder="Finish Network+ Module 6" />
        </div>
        <div class="next-action-wrap">
          <p class="label">NEXT ACTION</p>
          <input id="nextActionInput" type="text" placeholder="Complete lessons 6.1–6.3" />
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <p class="eyebrow">TODAY</p>
            <h3>Daily lanes</h3>
          </div>
          <button id="resetTodayBtn" class="text-btn">Reset</button>
        </div>
        <div id="taskList" class="task-list"></div>
        <button id="addTaskBtn" class="add-btn">+ Add task</button>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <p class="eyebrow">TRAIN</p>
            <h3 id="workoutTitle">Today’s workout</h3>
          </div>
          <span id="workoutTag" class="tag">Strength</span>
        </div>
        <div id="workoutList" class="workout-list"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <p class="eyebrow">WEEKLY PROGRESS</p>
            <h3>Keep the system moving</h3>
          </div>
          <button id="resetWeekBtn" class="text-btn">New week</button>
        </div>
        <div id="progressList" class="progress-list"></div>
      </section>

      <section class="card compact">
        <p class="eyebrow">QUICK CAPTURE</p>
        <textarea id="captureInput" rows="3" placeholder="Lyrics, ideas, research notes, car parts, fashion references..."></textarea>
        <button id="saveCaptureBtn" class="primary-btn">Save to inbox</button>
        <div id="captureCount" class="muted"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-item active" data-view="today">Today</button>
      <button class="nav-item" data-view="schedule">Schedule</button>
      <button class="nav-item" data-view="progress">Progress</button>
      <button class="nav-item" data-view="hq">HQ</button>
    </nav>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="section-head">
        <h3>HUD Settings</h3>
        <button class="icon-btn" value="cancel" aria-label="Close">✕</button>
      </div>
      <label>
        Default mode
        <select id="defaultModeSelect">
          <option>Long Workday</option>
          <option>Short Workday</option>
          <option>Recovery Day</option>
          <option selected>Growth Day</option>
          <option>Open Day</option>
        </select>
      </label>
      <label>
        Cybersecurity weekly target
        <input id="cyberTargetInput" type="number" min="1" max="40" value="12" />
      </label>
      <label>
        Training weekly target
        <input id="trainingTargetInput" type="number" min="1" max="14" value="5" />
      </label>
      <label>
        Creative weekly target
        <input id="creativeTargetInput" type="number" min="1" max="30" value="8" />
      </label>
      <label>
        Learning weekly target
        <input id="learningTargetInput" type="number" min="1" max="30" value="5" />
      </label>
      <button id="saveSettingsBtn" class="primary-btn" value="default">Save settings</button>
    </form>
  </dialog>

  <dialog id="modeDialog">
    <form method="dialog" class="dialog-card">
      <h3>Choose today’s mode</h3>
      <div id="modeButtons" class="mode-buttons"></div>
      <button class="text-btn" value="cancel">Cancel</button>
    </form>
  </dialog>

  <template id="taskTemplate">
    <label class="task-row">
      <input type="checkbox" />
      <span class="task-copy">
        <strong></strong>
        <small></small>
      </span>
      <button class="delete-task" type="button" aria-label="Delete task">×</button>
    </label>
  </template>

  <script src="app.js"></script>
</body>
</html>
